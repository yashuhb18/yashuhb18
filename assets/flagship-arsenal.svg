<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1d" />
      <stop offset="100%" stop-color="#02050c" />
    </linearGradient>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", Courier, monospace;
      }
      .card-item {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <rect width="950" height="340" rx="16" fill="#040712" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title -->
  <g transform="translate(40, 36)">
    <text x="0" y="4" fill="#00f0ff" class="font-mono" font-size="11" font-weight="bold" letter-spacing="2">
      // BATTLE-TESTED ARSENAL • FLAGSHIP ARCHITECTURES
    </text>
    <text x="0" y="24" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">
      Engineered Systems &amp; Weaponry
    </text>
  </g>

  <!-- 4 Modular Horizontal Cards -->
  <g transform="translate(35, 78)">

    <!-- 01. PHANTOM -->
    <g transform="translate(0, 0)">
      <rect width="880" height="54" rx="8" fill="url(#cardGrad)" stroke="#1e3a8a" stroke-width="1.2" />
      <text x="20" y="33" fill="#38bdf8" class="font-sans" font-size="16" font-weight="bold">🛡️ PHANTOM</text>
      <text x="170" y="32" fill="#cbd5e1" class="font-sans" font-size="11.5">
        Autonomous Endpoint Hardware Threat Hunting &amp; USB Deception Matrix (MITRE ATT&amp;CK)
      </text>
      <!-- Tags -->
      <g transform="translate(680, 16)">
        <rect width="85" height="22" rx="4" fill="#031a24" stroke="#00f0ff" stroke-width="0.8" />
        <text x="42.5" y="15" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="9.5" font-weight="bold">Python • FastAPI</text>
      </g>
      <g transform="translate(775, 16)">
        <rect width="90" height="22" rx="4" fill="#081028" stroke="#3b82f6" stroke-width="0.8" />
        <text x="45" y="15" text-anchor="middle" fill="#60a5fa" class="font-mono" font-size="9.5" font-weight="bold">React • Vite</text>
      </g>
    </g>

    <!-- 02. CyberTwin -->
    <g transform="translate(0, 62)">
      <rect width="880" height="54" rx="8" fill="url(#cardGrad)" stroke="#4c1d95" stroke-width="1.2" />
      <text x="20" y="33" fill="#c084fc" class="font-sans" font-size="16" font-weight="bold">🧠 CyberTwin</text>
      <text x="170" y="32" fill="#cbd5e1" class="font-sans" font-size="11.5">
        AI Application Security Digital Twin &amp; Knowledge Graph Engine (OWASP/CWE/CVE)
      </text>
      <g transform="translate(670, 16)">
        <rect width="95" height="22" rx="4" fill="#140826" stroke="#a855f7" stroke-width="0.8" />
        <text x="47.5" y="15" text-anchor="middle" fill="#c084fc" class="font-mono" font-size="9.5" font-weight="bold">TanStack Start</text>
      </g>
      <g transform="translate(775, 16)">
        <rect width="90" height="22" rx="4" fill="#081028" stroke="#3b82f6" stroke-width="0.8" />
        <text x="45" y="15" text-anchor="middle" fill="#60a5fa" class="font-mono" font-size="9.5" font-weight="bold">Semgrep • AST</text>
      </g>
    </g>

    <!-- 03. JanDarpan AI -->
    <g transform="translate(0, 124)">
      <rect width="880" height="54" rx="8" fill="url(#cardGrad)" stroke="#78350f" stroke-width="1.2" />
      <text x="20" y="33" fill="#fbbf24" class="font-sans" font-size="16" font-weight="bold">🏛️ JanDarpan AI</text>
      <text x="170" y="32" fill="#cbd5e1" class="font-sans" font-size="11.5">
        4,290+ Welfare Scheme Discovery, GLM-4 Vision Audits &amp; Polygon Blockchain Proofs
      </text>
      <g transform="translate(670, 16)">
        <rect width="95" height="22" rx="4" fill="#1c1304" stroke="#f59e0b" stroke-width="0.8" />
        <text x="47.5" y="15" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="9.5" font-weight="bold">GLM-4 Vision</text>
      </g>
      <g transform="translate(775, 16)">
        <rect width="90" height="22" rx="4" fill="#170d2c" stroke="#8b5cf6" stroke-width="0.8" />
        <text x="45" y="15" text-anchor="middle" fill="#a78bfa" class="font-mono" font-size="9.5" font-weight="bold">Polygon Ledger</text>
      </g>
    </g>

    <!-- 04. HAXLR8 3.0 -->
    <g transform="translate(0, 186)">
      <rect width="880" height="54" rx="8" fill="url(#cardGrad)" stroke="#831843" stroke-width="1.2" />
      <text x="20" y="33" fill="#f472b6" class="font-sans" font-size="16" font-weight="bold">🚀 HAXLR8 3.0</text>
      <text x="170" y="32" fill="#cbd5e1" class="font-sans" font-size="11.5">
        National Level Hackathon Production Portal Hosted at MIT Mysore (haxrl8.vercel.app)
      </text>
      <g transform="translate(670, 16)">
        <rect width="95" height="22" rx="4" fill="#200613" stroke="#ec4899" stroke-width="0.8" />
        <text x="47.5" y="15" text-anchor="middle" fill="#f472b6" class="font-mono" font-size="9.5" font-weight="bold">React • Tailwind</text>
      </g>
      <g transform="translate(775, 16)">
        <rect width="90" height="22" rx="4" fill="#041a11" stroke="#10b981" stroke-width="0.8" />
        <text x="45" y="15" text-anchor="middle" fill="#34d399" class="font-mono" font-size="9.5" font-weight="bold">Vercel Edge</text>
      </g>
    </g>

  </g>
</svg>