<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1d" />
      <stop offset="100%" stop-color="#03060f" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="emeraldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", Courier, monospace;
      }
      @keyframes goldPulse {
        0%, 100% { filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.4)); }
        50% { filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.8)); }
      }
      .gold-trophy {
        animation: goldPulse 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Panel Container -->
  <rect width="950" height="380" rx="16" fill="#040712" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Title HUD -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="0" r="4" fill="#fbbf24" class="gold-trophy" />
    <text x="14" y="4" fill="#fbbf24" class="font-mono" font-size="11" font-weight="bold" letter-spacing="2">
      // PROVEN TRACK RECORD • NATIONAL &amp; STATE HACKATHON ACCOLADES
    </text>
    <text x="14" y="24" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">
      Hackathon Hall of Fame
    </text>
  </g>

  <!-- 4 Cards Grid (2x2) -->
  <g transform="translate(30, 85)">

    <!-- CARD 1: JanDarpan AI (1st Prize National Champion) -->
    <g transform="translate(10, 0)">
      <rect width="425" height="128" rx="12" fill="url(#cardBg)" stroke="url(#goldBorder)" stroke-width="1.8" filter="url(#glowGold)" />
      <!-- Content -->
      <g transform="translate(18, 24)">
        <rect x="0" y="0" width="165" height="22" rx="4" fill="#1c1304" stroke="#f59e0b" stroke-width="1" />
        <text x="82" y="15" text-anchor="middle" fill="#fbbf24" class="font-mono" font-size="9.5" font-weight="bold">
          🥇 1ST PRIZE • NATIONAL
        </text>
        <text x="390" y="15" text-anchor="end" fill="#64748b" class="font-mono" font-size="10">Tamil Nadu</text>

        <text x="0" y="46" fill="#ffffff" class="font-sans" font-size="16" font-weight="800">
          JanDarpan AI (जनदर्पण)
        </text>
        <text x="0" y="64" fill="#f59e0b" class="font-mono" font-size="10.5" font-weight="600">
          Dhanalakshmi Srinivasan College of Engineering
        </text>
        <text x="0" y="83" fill="#94a3b8" class="font-sans" font-size="11">
          4,290+ Welfare schemes, GLM-4 vision audits &amp; Polygon ledger.
        </text>
      </g>
    </g>

    <!-- CARD 2: RoomiFY (1st Prize Winner) -->
    <g transform="translate(455, 0)">
      <rect width="425" height="128" rx="12" fill="url(#cardBg)" stroke="url(#emeraldBorder)" stroke-width="1.6" />
      <g transform="translate(18, 24)">
        <rect x="0" y="0" width="150" height="22" rx="4" fill="#041a11" stroke="#10b981" stroke-width="1" />
        <text x="75" y="15" text-anchor="middle" fill="#34d399" class="font-mono" font-size="9.5" font-weight="bold">
          🥇 1ST PRIZE • WINNER
        </text>
        <text x="390" y="15" text-anchor="end" fill="#64748b" class="font-mono" font-size="10">Inter-College</text>

        <text x="0" y="46" fill="#ffffff" class="font-sans" font-size="16" font-weight="800">
          RoomiFY Platform
        </text>
        <text x="0" y="64" fill="#10b981" class="font-mono" font-size="10.5" font-weight="600">
          Inter-College Hackathon by Ethnotech Academy
        </text>
        <text x="0" y="83" fill="#94a3b8" class="font-sans" font-size="11">
          High-concurrency matching engine &amp; verified rental workflows.
        </text>
      </g>
    </g>

    <!-- CARD 3: CyberTwin (2nd Runner Up State Level) -->
    <g transform="translate(10, 142)">
      <rect width="425" height="128" rx="12" fill="url(#cardBg)" stroke="url(#purpleBorder)" stroke-width="1.6" />
      <g transform="translate(18, 24)">
        <rect x="0" y="0" width="180" height="22" rx="4" fill="#140826" stroke="#8b5cf6" stroke-width="1" />
        <text x="90" y="15" text-anchor="middle" fill="#c084fc" class="font-mono" font-size="9.5" font-weight="bold">
          🥉 2ND RUNNER-UP • STATE
        </text>
        <text x="390" y="15" text-anchor="end" fill="#64748b" class="font-mono" font-size="10">Karnataka</text>

        <text x="0" y="46" fill="#ffffff" class="font-sans" font-size="16" font-weight="800">
          CyberTwin AppSec Platform
        </text>
        <text x="0" y="64" fill="#a855f7" class="font-mono" font-size="10.5" font-weight="600">
          CIT Engineering College, Mandya
        </text>
        <text x="0" y="83" fill="#94a3b8" class="font-sans" font-size="11">
          AI security knowledge graph (OWASP/MITRE) &amp; patch synthesis.
        </text>
      </g>
    </g>

    <!-- CARD 4: PHANTOM (National Finalist Shortlisted) -->
    <g transform="translate(455, 142)">
      <rect width="425" height="128" rx="12" fill="url(#cardBg)" stroke="url(#cyanBorder)" stroke-width="1.6" />
      <g transform="translate(18, 24)">
        <rect x="0" y="0" width="185" height="22" rx="4" fill="#03161f" stroke="#00f0ff" stroke-width="1" />
        <text x="92" y="15" text-anchor="middle" fill="#38bdf8" class="font-mono" font-size="9.5" font-weight="bold">
          🎖️ NATIONAL FINALIST
        </text>
        <text x="390" y="15" text-anchor="end" fill="#64748b" class="font-mono" font-size="10">Maharashtra</text>

        <text x="0" y="46" fill="#ffffff" class="font-sans" font-size="16" font-weight="800">
          PHANTOM Deception Platform
        </text>
        <text x="0" y="64" fill="#00f0ff" class="font-mono" font-size="10.5" font-weight="600">
          D.Y. Patil College of Engineering, Maharashtra
        </text>
        <text x="0" y="83" fill="#94a3b8" class="font-sans" font-size="11">
          Hardware USB threat hunting, honeytoken isolation &amp; sub-sec mitigation.
        </text>
      </g>
    </g>

  </g>
</svg>