<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="100%">
  <defs>
    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", Courier, monospace;
      }
    </style>
  </defs>

  <rect width="950" height="250" rx="16" fill="#040712" stroke="#1e293b" stroke-width="1.2" />

  <!-- Title -->
  <g transform="translate(40, 36)">
    <text x="0" y="4" fill="#10b981" class="font-mono" font-size="11" font-weight="bold" letter-spacing="2">
      // WEAPONRY &amp; CAPABILITIES • SYSTEM ARCHITECTURE
    </text>
    <text x="0" y="24" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">
      Technical Arsenal Matrix
    </text>
  </g>

  <!-- 3 Columns -->
  <g transform="translate(40, 85)">

    <!-- Column 1: Cybersecurity & SOC -->
    <g transform="translate(0, 0)">
      <rect width="270" height="135" rx="10" fill="#070d1e" stroke="#1e3a8a" stroke-width="1" />
      <g transform="translate(16, 22)">
        <text x="0" y="0" fill="#38bdf8" class="font-mono" font-size="12" font-weight="bold">🛡️ CYBER &amp; SOC DEFENSE</text>
        <g transform="translate(0, 16)" class="font-mono" font-size="10" fill="#94a3b8">
          <text x="0" y="0">• MITRE ATT&amp;CK Framework</text>
          <text x="0" y="16">• Zero-Trust Architecture</text>
          <text x="0" y="32">• Hardware Deception &amp; Honeytokens</text>
          <text x="0" y="48">• Semgrep • Trivy • Gitleaks</text>
          <text x="0" y="64">• Wireshark • Burp Suite • Nmap</text>
          <text x="0" y="80">• Cryptography (RSA / AES-256)</text>
        </g>
      </g>
    </g>

    <!-- Column 2: AI & Reasoning -->
    <g transform="translate(295, 0)">
      <rect width="275" height="135" rx="10" fill="#0c071d" stroke="#581c87" stroke-width="1" />
      <g transform="translate(16, 22)">
        <text x="0" y="0" fill="#c084fc" class="font-mono" font-size="12" font-weight="bold">🧠 AI &amp; REASONING ENGINES</text>
        <g transform="translate(0, 16)" class="font-mono" font-size="10" fill="#94a3b8">
          <text x="0" y="0">• AppSec Digital Twins</text>
          <text x="0" y="16">• Security Knowledge Graphs</text>
          <text x="0" y="32">• GLM-4 &amp; Computer Vision</text>
          <text x="0" y="48">• Keystroke Dynamics Classifier</text>
          <text x="0" y="64">• Scikit-Learn • Anomaly ML</text>
          <text x="0" y="80">• Multi-Turn LLM Reasoning</text>
        </g>
      </g>
    </g>

    <!-- Column 3: Full Stack & Cloud -->
    <g transform="translate(595, 0)">
      <rect width="275" height="135" rx="10" fill="#041417" stroke="#0e7490" stroke-width="1" />
      <g transform="translate(16, 22)">
        <text x="0" y="0" fill="#00f0ff" class="font-mono" font-size="12" font-weight="bold">⚡ SYSTEMS &amp; CLOUD</text>
        <g transform="translate(0, 16)" class="font-mono" font-size="10" fill="#94a3b8">
          <text x="0" y="0">• Python 3.11 • TypeScript</text>
          <text x="0" y="16">• FastAPI • Node.js • React 18</text>
          <text x="0" y="32">• TanStack Start • Tailwind CSS</text>
          <text x="0" y="48">• Docker • CI/CD DevSecOps</text>
          <text x="0" y="64">• Linux (Kali / Debian / Arch)</text>
          <text x="0" y="80">• Polygon Decentralized Ledger</text>
        </g>
      </g>
    </g>

  </g>
</svg>