<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <linearGradient id="cyanRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#ff8800" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; transform: scaleX(0.98); }
        50% { opacity: 1; transform: scaleX(1); }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-10px); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateY(290px); opacity: 0; }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes textGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4)); }
        50% { filter: drop-shadow(0 0 25px rgba(255, 0, 85, 0.7)); }
      }
      .hud-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 7px;
        text-transform: uppercase;
        animation: textGlow 4s infinite ease-in-out;
      }
      .scanline {
        animation: scanSweep 4s linear infinite;
      }
      .radar-sweep {
        transform-origin: 880px 60px;
        animation: radarRotate 5s linear infinite;
      }
      .font-mono {
        font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", Courier, monospace;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="950" height="280" rx="16" fill="url(#bgGrad)" stroke="#1a2744" stroke-width="1.5" />
  <rect width="950" height="280" rx="16" fill="url(#grid)" />

  <!-- Animated Scanline -->
  <line x1="10" y1="0" x2="940" y2="0" stroke="#00f0ff" stroke-width="2" class="scanline" />

  <!-- Cybernetic Corner Accents -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 925 50 L 925 25 L 900 25" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 25 230 L 25 255 L 50 255" fill="none" stroke="#00f0ff" stroke-width="3" />
  <path d="M 925 230 L 925 255 L 900 255" fill="none" stroke="#00f0ff" stroke-width="3" />

  <!-- Hexagonal Tech Decals -->
  <circle cx="25" cy="25" r="4" fill="#00f0ff" />
  <circle cx="925" cy="25" r="4" fill="#00f0ff" />
  <circle cx="25" cy="255" r="4" fill="#00f0ff" />
  <circle cx="925" cy="255" r="4" fill="#00f0ff" />

  <!-- Top Telemetry Status Strip -->
  <g transform="translate(45, 38)" class="font-mono" font-size="11" letter-spacing="1.5">
    <circle cx="6" cy="4" r="4" fill="#00f0ff" filter="url(#glowCyan)" />
    <text x="20" y="8" fill="#38bdf8" font-weight="600">SYS_ID: YHB-BATMAN.01</text>
    <text x="210" y="8" fill="#64748b">|</text>
    <text x="230" y="8" fill="#10b981" font-weight="600">TELEMETRY: OPERATIONAL</text>
    <text x="440" y="8" fill="#64748b">|</text>
    <text x="460" y="8" fill="#f59e0b" font-weight="600">TROPHIES: 4 PODIUMS</text>
    <text x="640" y="8" fill="#64748b">|</text>
    <text x="660" y="8" fill="#94a3b8">ORIGIN: MIT MYSORE (ECE)</text>
  </g>

  <!-- Interactive Radar Reticle (Top Right) -->
  <g>
    <circle cx="880" cy="60" r="28" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />
    <circle cx="880" cy="60" r="16" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
    <line x1="880" y1="28" x2="880" y2="92" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <line x1="848" y1="60" x2="912" y2="60" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
    <line x1="880" y1="60" x2="905" y2="40" stroke="#00f0ff" stroke-width="2" class="radar-sweep" filter="url(#glowCyan)" />
    <circle cx="880" cy="60" r="3" fill="#ff0055" />
  </g>

  <!-- Central Hero Name -->
  <g transform="translate(475, 125)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-size="44" class="hud-title">
      YASHWANTH H B
    </text>
    <!-- Cyan Subline Beam -->
    <rect x="-320" y="14" width="640" height="2.5" fill="url(#cyanRed)" rx="1" />
    <rect x="-30" y="12" width="60" height="6" fill="#00f0ff" filter="url(#glowCyan)" rx="2" />
  </g>

  <!-- Subtitle Terminal Prompt -->
  <g transform="translate(475, 175)" class="font-mono">
    <text x="0" y="0" text-anchor="middle" fill="#00f0ff" font-size="14" font-weight="600" letter-spacing="3">
      [ AUTONOMOUS HARDWARE DECEPTION • AI APPSEC DIGITAL TWINS • ZERO-TRUST ]
    </text>
  </g>

  <!-- Bottom Cyber Badges Row -->
  <g transform="translate(475, 225)">
    <!-- Badge 1: 1st Prize National -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="195" height="28" rx="6" fill="#1c1304" stroke="#f59e0b" stroke-width="1.2" />
      <text x="97" y="18" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="10.5" font-weight="bold">
        🥇 1ST PRIZE NATIONAL
      </text>
    </g>

    <!-- Badge 2: AppSec Twin -->
    <g transform="translate(-110, 0)">
      <rect x="0" y="0" width="205" height="28" rx="6" fill="#0b0f24" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="102" y="18" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10.5" font-weight="bold">
        🧠 APPSEC DIGITAL TWIN
      </text>
    </g>

    <!-- Badge 3: Hardware Deception -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="210" height="28" rx="6" fill="#03161c" stroke="#00f0ff" stroke-width="1.2" />
      <text x="105" y="18" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="10.5" font-weight="bold">
        🛡️ HARDWARE DECEPTION
      </text>
    </g>
  </g>

</svg>